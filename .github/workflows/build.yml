name: Build Play Store Release AAB & APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-33 build-tools;33.0.2

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply Custom Icon, Real AdMob & Secure Signing Config
        run: node configure-admob.cjs

      - name: Unlock Keystore & Build Signed Play Store AAB + APK
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 - << 'PYEOF'
          import os, json, base64, hashlib, subprocess

          seed = b"ca-app-pub-4326644127523914~2784148145"
          with open(".signing_vault.enc", "r", encoding="utf-8") as vf:
              enc_data = base64.b64decode(vf.read().strip())

          out = bytearray(len(enc_data))
          for i in range(0, len(enc_data), 32):
              blk = hashlib.sha256(seed + str(i // 32).encode()).digest()
              for j in range(min(32, len(enc_data) - i)):
                  out[i + j] = enc_data[i + j] ^ blk[j]

          vault = json.loads(bytes(out).decode('utf-8'))
          ks_bytes = base64.b64decode(vault["ks"])
          pwd = vault["pwd"]

          ks_out = "android/app/release-key.keystore"
          with open(ks_out, "wb") as kf:
              kf.write(ks_bytes)

          subprocess.run(
              ["keytool", "-list", "-keystore", ks_out, "-storepass", pwd],
              check=True, stdout=subprocess.DEVNULL
          )
          print("✅ Keystore & Password verified 100% with keytool!")

          with open("android/keystore.properties", "w", encoding="utf-8") as pf:
              pf.write(f"storePassword={pwd}\nkeyPassword={pwd}\nkeyAlias=ballsort_key\n")
          PYEOF

          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
          rm -f app/release-key.keystore keystore.properties

      - name: Upload Play Store AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: playstore-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed Release APK (For Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
