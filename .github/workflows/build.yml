name: Build Play Store Release AAB & APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-33 build-tools;33.0.2

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply Custom Icon, Real AdMob & Release Signing Config
        run: node configure-admob.cjs

      - name: Build Signed Play Store AAB & Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease || (sed -i 's/minSdkVersion = 21/minSdkVersion = 23/g' variables.gradle && ./gradlew bundleRelease assembleRelease) || (sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' variables.gradle && ./gradlew bundleRelease assembleRelease)

      - name: Upload Play Store AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: playstore-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed Release APK (For Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
