name: Build Play Store Release AAB & APK

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-33 build-tools;33.0.2

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Apply Custom Icon, Real AdMob & Secure Signing Config
        run: node configure-admob.cjs

      - name: Build Signed Play Store AAB & Release APK
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 - << 'PYEOF'
          import os, re, base64, sys

          raw_b64 = os.environ.get("RAW_KEYSTORE_BASE64", "")
          raw_pwd = os.environ.get("RAW_KEYSTORE_PASSWORD", "")

          if not raw_b64 or not raw_pwd:
              print("❌ ERROR: GitHub Secrets KEYSTORE_BASE64 or KEYSTORE_PASSWORD is empty!")
              sys.exit(1)

          # Extract base64 starting from MII and remove any ==== borders or spaces
          m_b64 = re.search(r'(MII[A-Za-z0-9+/=\s]+)', raw_b64)
          clean_b64 = m_b64.group(1) if m_b64 else raw_b64
          clean_b64 = re.sub(r'={3,}', '', clean_b64)
          clean_b64 = re.sub(r'[^A-Za-z0-9+/=]', '', clean_b64)
          if len(clean_b64) % 4 != 0:
              clean_b64 += '=' * (4 - (len(clean_b64) % 4))

          keystore_bytes = base64.b64decode(clean_b64)
          with open("android/app/release-key.keystore", "wb") as f:
              f.write(keystore_bytes)
          print(f"✅ Keystore decoded cleanly ({len(keystore_bytes)} bytes)")

          # Extract clean password (e.g., Hasan_...)
          m_pwd = re.search(r'(Hasan_[A-Za-z0-9]+)', raw_pwd)
          clean_pwd = m_pwd.group(1) if m_pwd else raw_pwd.strip()
          with open(".clean_keystore_pwd", "w") as pf:
              pf.write(clean_pwd)
          PYEOF

          export KEYSTORE_PASSWORD=$(cat .clean_keystore_pwd)
          rm -f .clean_keystore_pwd

          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease || (sed -i 's/minSdkVersion = 21/minSdkVersion = 23/g' variables.gradle && ./gradlew bundleRelease assembleRelease) || (sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' variables.gradle && ./gradlew bundleRelease assembleRelease)
          rm -f app/release-key.keystore

      - name: Upload Play Store AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: playstore-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed Release APK (For Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
